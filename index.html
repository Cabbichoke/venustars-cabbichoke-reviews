<script>

// 베스트 후기 자동 회전
const bestReviews = [
  { product:"캐비초크 크리스탈", text:"남편이 당뇨와 갑상선기능 저하중인 저의 필수 제품. 몇년 동안 이 제품 먹고 감기 한번도 안걸려서 의기양양 했는데 다른 제품으로 바꾼 이후 감기로 고생ㅠㅠ. 다시 크리스탈로 돌아옴.", tags:["위장/소화","당뇨/혈당","면역/감기"], date:"2026.03.01" },
  { product:"캐비초크 리바이브", text:"몇년째 챙겨먹고 있는 항암4종세트~~~덕분에 4기암환자같지않게 건강하게 잘 참지내고 있습니다. 계속 항암중인데도 주위에서 피부에서 광이 난다고 ㅎㅎ 감사한 삶을 살고있네요.", tags:["항암/암","피부/미용"], date:"2026.03.01" },
  { product:"콜라겐 10,000mg", text:"복용중엔 매끈하고 반짝이는 피부가 당연한줄 알지만 구매시기 놓쳐서 며칠 못먹으면 피부가 바로 알아요. 효과면에서 절대 비싸다고 할 수 없는 제품입니다!", tags:["피부/미용"], date:"2026.03.01" },
  { product:"캐비초크 오리지날", text:"혈압약을 10년째 먹고 있는데 캐비초크 먹은 후 혈압이 안정되면서 의사 선생님이 약을 줄여도 될 것 같다고 하셨어요.", tags:["혈압","에너지/피로"], date:"2026.02.20" },
  { product:"캐비초크 리바이브", text:"소화기 계통이 안 좋아서 시작했는데 먹기 시작한 지 일주일 만에 화장실을 매일 가게 됐어요. 3개월째 먹고 있는데 위장이 많이 편안해졌고 피부도 좋아졌어요!", tags:["위장/소화","피부/미용"], date:"2026.02.15" }
];
const tagColors = {"항암/암":"#dc2626","피부/미용":"#ec4899","위장/소화":"#f59e0b","당뇨/혈당":"#8b5cf6","면역/감기":"#06b6d4","혈압":"#3b82f6","에너지/피로":"#f97316"};
let rvCurrent = 0, rvTimer = null;
function rvShow(idx, animate) {
  const r = bestReviews[idx];
  const textEl = document.getElementById('rv-text');
  const run = () => {
    document.getElementById('rv-product').textContent = '🛒 ' + r.product;
    textEl.textContent = r.text;
    document.getElementById('rv-date').textContent = r.date;
    document.getElementById('rv-tags').innerHTML = r.tags.map(t =>
      '<span style="background:' + (tagColors[t]||'#6b7280') + '22;color:' + (tagColors[t]||'#6b7280') + ';font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;">' + t + '</span>'
    ).join('');
    document.getElementById('rv-dots').innerHTML = bestReviews.map((_, i) =>
      '<span onclick="rvGo(' + i + ')" style="display:inline-block;width:' + (i===idx?'20px':'8px') + ';height:8px;border-radius:4px;background:' + (i===idx?'#1a5c3a':'#ccc') + ';cursor:pointer;transition:all 0.3s;"></span>'
    ).join('');
    if (animate) textEl.style.opacity = '1';
  };
  if (animate) { textEl.style.opacity = '0'; setTimeout(run, 350); } else run();
}
function rvGo(idx) {
  rvCurrent = idx; rvShow(idx, true);
  clearInterval(rvTimer);
  rvTimer = setInterval(() => { rvCurrent = (rvCurrent+1) % bestReviews.length; rvShow(rvCurrent, true); }, 5000);
}
rvShow(0, false);
rvTimer = setInterval(() => { rvCurrent = (rvCurrent+1) % bestReviews.length; rvShow(rvCurrent, true); }, 5000);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(e => console.log('SW error:', e));
}

let deferredPrompt;
const installButton = document.getElementById('installButton');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installButton.style.display = 'none';
});
</script>
