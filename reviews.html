<style>
:root {
  --green-deep: #1a5c3a;
  --green-mid: #2d7a52;
  --green-light: #e8f5ee;
  --gold: #f5a623;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #f8f9fa; color: #1a1a1a; -webkit-user-select: none; user-select: none; }

.site-header { background: var(--green-deep); color: white; padding: 20px; text-align: center; }
.site-header h1 { font-size: clamp(20px,5vw,28px); font-weight: 700; }
.site-header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.back-link { display: inline-block; margin-top: 10px; color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; }

.search-area { background: white; padding: 16px 20px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.search-input { width: 100%; padding: 10px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s; }
.search-input:focus { border-color: var(--green-deep); }

.filter-area { background: white; padding: 10px 16px 12px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
.filter-btn { display: inline-block; padding: 6px 12px; margin: 3px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; background: white; color: #555; transition: all 0.2s; white-space: nowrap; }
.filter-btn:hover { border-color: var(--green-deep); color: var(--green-deep); }
.filter-btn.active { background: var(--green-deep); color: white; border-color: var(--green-deep); }

.product-filter { background: #f8f9fa; padding: 8px 16px 10px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
.prod-btn { display: inline-block; padding: 5px 10px; margin: 2px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid #ddd; background: white; color: #666; transition: all 0.2s; white-space: nowrap; }
.prod-btn:hover { border-color: var(--green-mid); color: var(--green-mid); }
.prod-btn.active { background: var(--green-mid); color: white; border-color: var(--green-mid); }

.stats-bar { background: white; padding: 10px 16px; border-bottom: 1px solid #eee; font-size: 13px; color: #666; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.stats-bar > div span { color: var(--green-deep); font-weight: 700; }

.all-reviews-btn { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--green-deep); background: white; color: var(--green-deep); cursor: pointer; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
.all-reviews-btn:hover:not(:disabled) { background: var(--green-deep); color: white; }
.all-reviews-btn:disabled { opacity: 0.55; cursor: default; }

.reviews-container { max-width: 800px; margin: 0 auto; padding: 12px 16px; }
.review-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); position: relative; }
.review-card.best { border-left: 3px solid var(--gold); }
.best-badge { display: inline-block; background: var(--gold); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-bottom: 6px; }
.product-link { display: inline-block; font-size: 11px; color: var(--green-deep); text-decoration: none; border: 1px solid var(--green-light); background: var(--green-light); padding: 3px 8px; border-radius: 5px; margin-bottom: 8px; font-weight: 600; transition: all 0.2s; }
.product-link:hover { background: var(--green-deep); color: white; }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.rating { color: #f5a623; font-size: 14px; }
.author-date { font-size: 11px; color: #999; }
.review-text { font-size: 14px; line-height: 1.7; color: #333; }
.tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--green-light); color: var(--green-deep); }
.copyright { font-size: 10px; color: rgba(26,92,58,0.15); text-align: right; margin-top: 8px; }

.load-more { display: block; width: 100%; max-width: 400px; margin: 16px auto; padding: 14px; background: var(--green-deep); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.load-more:hover { background: var(--green-mid); }
.loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
.no-results { text-align: center; padding: 60px 20px; color: #999; }

.site-footer { background: var(--green-deep); color: rgba(255,255,255,0.75); text-align: center; padding: 18px; font-size: 12px; letter-spacing: .5px; margin-top: 20px; }
</style>
</head>
<body>

<div class="site-header">
  <h1>⭐ VENUSTARS 전체 리뷰</h1>
  <p>실제 고객 19,074명의 사용 후기</p>
  <a href="./index.html" class="back-link">← 메인으로</a>
</div>

<div class="search-area">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 증상, 제품명으로 검색 (예: 항암, 혈압, 소화)">
</div>

<div class="filter-area">
  <button class="filter-btn" onclick="toggleTag(this, '')">전체</button>
  <button class="filter-btn" onclick="toggleTag(this, '항암/암/회복')">항암/암</button>
  <button class="filter-btn" onclick="toggleTag(this, '위장/소화')">위장/소화</button>
  <button class="filter-btn" onclick="toggleTag(this, '혈압/콜레스테롤')">혈압</button>
  <button class="filter-btn" onclick="toggleTag(this, '당뇨/혈당')">당뇨</button>
  <button class="filter-btn" onclick="toggleTag(this, '피부/미용')">피부/미용</button>
  <button class="filter-btn" onclick="toggleTag(this, '면역/감기')">면역</button>
  <button class="filter-btn" onclick="toggleTag(this, '에너지/피로')">에너지/피로</button>
  <button class="filter-btn" onclick="toggleTag(this, '관절/뼈')">관절/뼈</button>
  <button class="filter-btn" onclick="toggleTag(this, '간/해독')">간/해독</button>
  <button class="filter-btn" onclick="toggleTag(this, '체중/다이어트')">다이어트</button>
  <button class="filter-btn" onclick="toggleTag(this, '갱년기/호르몬')">갱년기</button>
</div>

<div class="product-filter">
  <button class="prod-btn active" onclick="toggleProduct(this, '')">전체 상품</button>
  <button class="prod-btn" onclick="toggleProduct(this, '캐비초크 리바이브')">캐비초크 리바이브</button>
  <button class="prod-btn" onclick="toggleProduct(this, '캐비초크 오리지널')">캐비초크 오리지널</button>
  <button class="prod-btn" onclick="toggleProduct(this, '캐비초크 크리스탈')">캐비초크 크리스탈</button>
  <button class="prod-btn" onclick="toggleProduct(this, '캐비초크 프리미엄 골드')">프리미엄 골드</button>
  <button class="prod-btn" onclick="toggleProduct(this, '캐비초크 어드반스드')">어드반스드</button>
  <button class="prod-btn" onclick="toggleProduct(this, '콜라겐 10,000mg/1일')">콜라겐 10,000mg</button>
  <button class="prod-btn" onclick="toggleProduct(this, '다이아몬드펄')">다이아몬드펄</button>
  <button class="prod-btn" onclick="toggleProduct(this, '안티에이징')">안티에이징</button>
</div>

<div class="stats-bar">
  <div><span id="countDisplay">...</span>개 리뷰</div>
  <button class="all-reviews-btn" id="allReviewsBtn" onclick="loadAllReviews()">
    ⬇ 전체 19,074개 보기
  </button>
</div>

<div class="reviews-container" id="reviewsContainer">
  <div class="loading">⏳ 리뷰를 불러오는 중입니다...</div>
</div>
<button class="load-more" id="loadMoreBtn" onclick="loadMore()" style="display:none">더 보기</button>

<div class="site-footer">© 2026 VENUSTARS®. All rights reserved.</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());

let _reviews = [];
let filtered = [];
let displayed = 0;
const PAGE = 20;
let currentTag = '';
let currentProduct = '';
let searchTerm = '';
let allLoaded = false;
let loadingAll = false;

function toggleTag(btn, tag) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  currentTag = tag;
  btn.classList.add('active');
  applyFilters();
}

function toggleProduct(btn, prod) {
  document.querySelectorAll('.prod-btn').forEach(b => b.classList.remove('active'));
  currentProduct = prod;
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const term = searchTerm.toLowerCase();
  filtered = _reviews.filter(r => {
      if (currentTag && !(r.tags || []).includes(currentTag)) return false;
    if (currentProduct && r.product !== currentProduct) return false;
    if (term && !r.text.toLowerCase().includes(term) &&
        !r.product.toLowerCase().includes(term) &&
        !(r.tags || []).some(t => t.toLowerCase().includes(term))) return false;
    return true;
  });
  displayed = 0;
  document.getElementById('countDisplay').textContent = filtered.length.toLocaleString();
  document.getElementById('reviewsContainer').innerHTML = '';
  loadMore();
}

function loadMore() {
  const container = document.getElementById('reviewsContainer');
  const chunk = filtered.slice(displayed, displayed + PAGE);
  chunk.forEach(r => {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const tagsHtml = (r.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    const bestBadge = r.best ? '<span class="best-badge">⭐ 베스트</span><br>' : '';
    const cardClass = r.best ? 'review-card best' : 'review-card';
    const text = r.text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const marked = text.split('').map((c,i) => i%30===29 ? c+'\u200b' : c).join('');
    const productSafe = r.product.replace(/'/g,"\\'");
    container.innerHTML += `<div class="${cardClass}">
      ${bestBadge}
      <a href="${r.productUrl}" target="_blank" rel="noopener" class="product-link"
         onclick="gtag('event','store_click',{product_name:'${productSafe}',page_location:location.href})">🛒 ${r.product}</a>
      <div class="review-header">
        <span class="rating">${stars} ${r.rating}점</span>
        <span class="author-date">${r.author} · ${r.date}</span>
      </div>
      <div class="review-text">${marked}</div>
      ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
      <div class="copyright">© VENUSTARS 인증 리뷰</div>
    </div>`;
  });
  displayed += chunk.length;
  document.getElementById('loadMoreBtn').style.display = displayed < filtered.length ? 'block' : 'none';
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">검색 결과가 없습니다</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', function() {
  searchTerm = this.value;
  if (searchTerm && !allLoaded && !loadingAll) {
    loadAllReviews(true);
    return;
  }
  applyFilters();
});

function loadAllReviews(fromSearch) {
  if (allLoaded || loadingAll) return;
  loadingAll = true;
  const btn = document.getElementById('allReviewsBtn');
  btn.textContent = '⏳ 불러오는 중...';
  btn.disabled = true;

  fetch('reviews_all.json')
    .then(r => {
      if (!r.ok) throw new Error('로드 실패 (' + r.status + ')');
      return r.json();
    })
    .then(rest => {
      _reviews = _reviews.concat(rest);
      allLoaded = true;
      loadingAll = false;
      btn.textContent = '✅ 전체 19,074개 로드 완료';
      btn.disabled = true;
      applyFilters();
    })
    .catch(err => {
      loadingAll = false;
      btn.textContent = '⬇ 전체 19,074개 보기';
      btn.disabled = false;
      alert('전체 리뷰 로드 중 오류가 발생했습니다.\n' + err.message);
    });
}

// 초기 로드: 베스트 1,890개
fetch('reviews_best.json')
  .then(r => {
    if (!r.ok) throw new Error('리뷰 로드 실패 (' + r.status + ')');
    return r.json();
  })
  .then(data => {
    _reviews = data;
    applyFilters();
  })
  .catch(err => {
    document.getElementById('reviewsContainer').innerHTML =
      `<div class="no-results" style="color:#c0392b;">
        데이터를 불러오지 못했습니다.<br>
        <small>${err.message}</small><br><br>
        <small>reviews_best.json 파일이 같은 폴더에 있는지 확인해 주세요.</small>
      </div>`;
  });
</script>
</body>
</html>
