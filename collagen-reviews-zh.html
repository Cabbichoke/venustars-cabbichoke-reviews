<body>

<div class="header">
  <div class="header-badge">VENUSTARS® · 胶原蛋白 10,000mg</div>
  <h1>真实用户评价搜索</h1>
  <div class="header-sub">低分子鱼胶原蛋白 · 仅收录购买认证评价</div>
  <div class="search-wrap">
    <input class="search-input" type="text" id="searchInput"
      placeholder="皮肤、皱纹、关节、脱发..." autocomplete="off">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <a class="header-buy"
     href="https://smartstore.naver.com/venustars/products/3203612555"
     target="_blank" rel="noopener">🛒 韩国官方购买</a>
  <div class="tag-wrap" id="tagWrap"></div>
</div>

<div class="content">
  <div class="stats-bar">
    <span class="stats-total" id="statsTotal">加载中...</span>
    <span class="stats-sub" id="statsSub"></span>
  </div>
  <div class="beta-notice">
    📢 <strong>精选版</strong> — 收录453条精选评价（中文翻译版）。
  </div>
  <div id="reviewList"></div>
  <button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">查看更多评价 ↓</button>
  <a class="store-link"
     href="https://smartstore.naver.com/venustars/products/3203612555"
     target="_blank" rel="noopener">🛒 前往韩国官方旗舰店购买</a>
</div>

<script>
const DATA_URL = 'reviews_collagen_zh_beta.json';
const PAGE_SIZE = 15;
const TAGS = ['皮肤/美容','关节/骨骼','头发/头皮','消化/肠道','免疫力','睡眠','消除疲劳','眼睛健康','抗癌'];

let allReviews = [];
let filtered = [];
let page = 0;
let currentTag = '';
let currentQuery = '';

async function init() {
  try {
    const res = await fetch(DATA_URL);
    allReviews = await res.json();
    document.getElementById('statsTotal').textContent = `胶原蛋白评价 共 ${allReviews.length} 条`;
    document.getElementById('statsSub').textContent = `精选优质评价`;
    renderTags();
    applyFilter();
  } catch(e) {
    document.getElementById('reviewList').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>加载失败，请刷新页面重试。</div>';
  }
}

function renderTags() {
  const wrap = document.getElementById('tagWrap');
  wrap.innerHTML = '';
  TAGS.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (tag === currentTag ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => { currentTag = currentTag === tag ? '' : tag; renderTags(); applyFilter(); };
    wrap.appendChild(btn);
  });
}

function doSearch() {
  currentQuery = document.getElementById('searchInput').value.trim();
  applyFilter();
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function applyFilter() {
  const q = currentQuery.toLowerCase();
  filtered = allReviews.filter(r => {
    const tagMatch = !currentTag || (r.tags_zh && r.tags_zh.includes(currentTag));
    const textMatch = !q || r.text_zh.toLowerCase().includes(q) || r.text.toLowerCase().includes(q);
    return tagMatch && textMatch;
  });

  page = 0;
  document.getElementById('reviewList').innerHTML = '';

  if (filtered.length === 0) {
    document.getElementById('reviewList').innerHTML =
      '<div class="empty"><div class="empty-icon">🔍</div>没有找到相关评价。<br>请尝试其他关键词。</div>';
    document.getElementById('loadMoreBtn').style.display = 'none';
    document.getElementById('statsTotal').textContent = `搜索结果 0 条`;
    return;
  }

  document.getElementById('statsTotal').textContent =
    q || currentTag ? `搜索结果 ${filtered.length} 条` : `胶原蛋白评价 共 ${allReviews.length} 条`;
  document.getElementById('statsSub').textContent =
    q ? `"${currentQuery}" 搜索结果` : currentTag ? `#${currentTag}` : `精选优质评价`;

  renderPage();
}

function renderPage() {
  const list = document.getElementById('reviewList');
  const slice = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  slice.forEach(r => {
    const card = document.createElement('div');
    card.className = 'review-card';
    const tagsHtml = (r.tags_zh && r.tags_zh.length)
      ? `<div class="card-tags">${r.tags_zh.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>` : '';
    const text = highlight(escHtml(r.text_zh || r.text), currentQuery);
    card.innerHTML = `
      <div class="card-top">
        ${r.best ? '<span class="best-badge">⭐ 精选</span>' : ''}
        <div class="card-meta"><span class="card-author">${r.author}</span> · ${r.date} · ⭐ ${r.rating}</div>
      </div>
      ${tagsHtml}
      <div class="card-text">${text}</div>`;
    list.appendChild(card);
  });

  page++;
  document.getElementById('loadMoreBtn').style.display =
    page * PAGE_SIZE < filtered.length ? 'block' : 'none';
}

function loadMore() { renderPage(); }

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => `<mark>${m}</mark>`);
}

init();
</script>
