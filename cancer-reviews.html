<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>항암·암 관련 후기 1,262개 검색 | VENUSTARS 캐비초크</title>
<meta name="description" content="캐비초크·콜라겐 항암 관련 실제 구매 고객 후기 1,262개. 항암 중 부작용, 면역력, 암 수치 변화 등 증상별 검색.">
<meta property="og:title" content="항암·암 관련 후기 1,262개 보기 및 검색">
<meta property="og:description" content="캐비초크·콜라겐 항암 실제 고객 후기. 화학요법 부작용, 면역력, 암 수치 등 검색 가능.">
<meta property="og:image" content="https://cabbichoke.github.io/venustars-cabbichoke-reviews/penguin.png">
<meta property="og:type" content="website">
<style>
:root {
  --green: #1a5c3a;
  --green-light: #e8f5ee;
  --gold: #c8953a;
  --border: #d0e8d8;
  --text: #222;
  --text-mid: #555;
  --text-light: #888;
  --bg: #f4faf6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background: var(--bg); color: var(--text); }

.header {
  background: var(--green);
  padding: 24px 20px 18px;
  text-align: center;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header-badge { display: inline-block; background: rgba(255,255,255,0.15); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 12px; border-radius: 20px; color: rgba(255,255,255,0.9); margin-bottom: 8px; }
.header h1 { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.4; margin-bottom: 4px; }
.header-sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 14px; }

.search-wrap { display: flex; gap: 8px; max-width: 500px; margin: 0 auto 10px; }
.search-input { flex: 1; padding: 10px 16px; border: none; border-radius: 50px; font-size: 14px; outline: none; font-family: inherit; }
.search-btn { padding: 10px 18px; background: var(--gold); color: white; border: none; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

.header-buy { display: inline-block; margin: 8px auto 0; padding: 8px 20px; background: var(--gold); color: white; border-radius: 50px; font-size: 13px; font-weight: 700; text-decoration: none; }

.tag-wrap { max-width: 560px; margin: 10px auto 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tag-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: rgba(255,255,255,0.85); font-size: 12px; cursor: pointer; font-family: inherit; }
.tag-btn.active { background: white; color: var(--green); border-color: white; font-weight: 700; }

.content { max-width: 680px; margin: 0 auto; padding: 16px 16px 60px; }

.stats-bar { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stats-total { font-size: 14px; font-weight: 700; color: var(--green); }
.stats-sub { font-size: 12px; color: var(--text-light); margin-left: auto; }

.review-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px 13px; margin-bottom: 10px; }
.card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.best-badge { background: var(--gold); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.card-meta { font-size: 12px; color: var(--text-light); line-height: 1.6; }
.card-author { font-weight: 600; color: var(--text-mid); }
.card-product { font-size: 11px; color: var(--green); font-weight: 600; margin-bottom: 6px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.card-tag { font-size: 11px; padding: 2px 8px; background: var(--green-light); color: var(--green); border-radius: 10px; font-weight: 600; }
.card-text { font-size: 14px; color: var(--text); line-height: 1.85; white-space: pre-wrap; word-break: keep-all; }
.card-text mark { background: #fff3b0; border-radius: 2px; padding: 0 1px; }

.empty { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 14px; }
.empty-icon { font-size: 36px; margin-bottom: 12px; }
.load-more { display: block; width: 100%; padding: 13px; background: white; border: 1px solid var(--border); border-radius: 12px; color: var(--green); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px; }
.store-link { display: block; text-align: center; margin: 20px 0 0; padding: 14px; background: var(--green); color: white; border-radius: 50px; font-size: 14px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">VENUSTARS® · 항암 고객 후기</div>
  <h1>항암·암 관련 실제 후기 검색</h1>
  <div class="header-sub">캐비초크·콜라겐 구매 인증 후기만 수록</div>
  <div class="search-wrap">
    <input class="search-input" type="text" id="searchInput" placeholder="항암, 화학요법, 면역, 수치..." autocomplete="off">
    <button class="search-btn" onclick="doSearch()">검색</button>
  </div>
  <a class="header-buy" href="https://smartstore.naver.com/venustars" target="_blank" rel="noopener">🛒 네이버 스마트스토어</a>
  <div class="tag-wrap" id="tagWrap"></div>
</div>

<div class="content">
  <div class="stats-bar">
    <span class="stats-total" id="statsTotal">불러오는 중...</span>
    <span class="stats-sub" id="statsSub"></span>
  </div>
  <div id="reviewList"><div class="empty"><div class="empty-icon">⏳</div>후기를 불러오는 중입니다...</div></div>
  <button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">후기 더 보기 ↓</button>
  <a class="store-link" href="https://smartstore.naver.com/venustars" target="_blank" rel="noopener">🛒 네이버 스마트스토어 바로가기</a>
</div>

<script>
const BEST_URL = 'reviews_cancer_best.json';
const ALL_URL  = 'reviews_cancer_all.json';
const PAGE_SIZE = 20;
const TAGS = ['항암','면역','피로회복','피부/미용','관절/뼈','수면','소화/장','혈당/당뇨'];

let all = [], filtered = [], page = 0, currentTag = '', currentQuery = '';

async function init() {
  try {
    const [b, a] = await Promise.all([fetch(BEST_URL), fetch(ALL_URL)]);
    const best = await b.json();
    const rest = await a.json();
    all = [...best.sort((x,y)=>y.date.localeCompare(x.date)), ...rest.sort((x,y)=>y.date.localeCompare(x.date))];
    document.getElementById('statsTotal').textContent = `항암·암 관련 후기 총 ${all.length.toLocaleString()}개`;
    document.getElementById('statsSub').textContent = `베스트 ${best.length}개 · 일반 ${rest.length}개`;
    renderTags(); applyFilter();
  } catch(e) {
    document.getElementById('reviewList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>후기를 불러올 수 없습니다.</div>';
  }
}

function renderTags() {
  const wrap = document.getElementById('tagWrap');
  wrap.innerHTML = TAGS.map(t =>
    `<button class="tag-btn${t===currentTag?' active':''}" onclick="toggleTag('${t}')">${t}</button>`
  ).join('');
}

function toggleTag(t) { currentTag = currentTag===t?'':t; renderTags(); applyFilter(); }
function doSearch() { currentQuery = document.getElementById('searchInput').value.trim(); applyFilter(); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
});

function applyFilter() {
  const q = currentQuery.toLowerCase();
  filtered = all.filter(r => {
    const tagOk = !currentTag || (r.tags||[]).includes(currentTag);
    const textOk = !q || r.text.toLowerCase().includes(q) || (r.product||'').toLowerCase().includes(q);
    return tagOk && textOk;
  });
  page = 0;
  document.getElementById('reviewList').innerHTML = '';
  if (!filtered.length) {
    document.getElementById('reviewList').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>검색 결과가 없습니다.</div>';
    document.getElementById('loadMoreBtn').style.display = 'none';
    document.getElementById('statsTotal').textContent = '검색 결과 0개';
    return;
  }
  document.getElementById('statsTotal').textContent = (q||currentTag) ? `검색 결과 ${filtered.length.toLocaleString()}개` : `항암·암 관련 후기 총 ${all.length.toLocaleString()}개`;
  document.getElementById('statsSub').textContent = q ? `"${currentQuery}" 검색 결과` : currentTag ? `#${currentTag}` : `베스트 포함`;
  renderPage();
}

function renderPage() {
  const list = document.getElementById('reviewList');
  filtered.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE).forEach(r => {
    const card = document.createElement('div');
    card.className = 'review-card';
    const tags = (r.tags||[]).map(t=>`<span class="card-tag">${t}</span>`).join('');
    const text = hl(esc(r.text), currentQuery);
    card.innerHTML = `
      <div class="card-top">
        ${r.best?'<span class="best-badge">⭐ 베스트</span>':''}
        <div class="card-meta"><span class="card-author">${r.author}</span> · ${r.date} · ⭐${r.rating}</div>
      </div>
      ${r.product?`<div class="card-product">${r.product}</div>`:''}
      ${tags?`<div class="card-tags">${tags}</div>`:''}
      <div class="card-text">${text}</div>`;
    list.appendChild(card);
  });
  page++;
  document.getElementById('loadMoreBtn').style.display = page*PAGE_SIZE < filtered.length ? 'block' : 'none';
}

function loadMore() { renderPage(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(t, q) {
  if(!q) return t;
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
}

init();
</script>
</body>
</html>
